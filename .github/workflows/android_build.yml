name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make Gradle executable
      run: chmod +x android-app/gradlew || true # Eğer gradlew dosyası yoksa hata vermesin diye

    - name: Build with Gradle
      run: |
        cd android-app
        # Gradle wrapper dosyaları eksik olsa bile gradle init ile oluşturulabilir 
        # veya yüklü gradle ile wrapper kurulabilir.
        # En garanti yol:
        gradle wrapper --gradle-version 8.2
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Gozetim-APK
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
