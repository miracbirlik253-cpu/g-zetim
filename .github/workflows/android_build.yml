name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # Disabling cache during GitHub infrastructure instability
        cache: '' 

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4
        # Disabling cache here as well
        cache-disabled: true

    - name: Build with Gradle
      run: |
        cd android-app
        # Generate wrapper using the installed gradle
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        # Run build with stacktrace for better debugging
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Gozetim-APK
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
